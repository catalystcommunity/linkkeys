apiVersion: v1
kind: Secret
metadata:
  name: {{ include "linkkeys.fullname" . }}
  labels:
    {{- include "linkkeys.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if not .Values.postgresql.enabled }}
  DATABASE_URL: {{ .Values.database.url | b64enc | quote }}
  {{- end }}
  {{- if .Values.server.domainKeyPassphrase }}
  DOMAIN_KEY_PASSPHRASE: {{ .Values.server.domainKeyPassphrase | b64enc | quote }}
  {{- end }}
  {{- if and .Values.smtp.enabled (not .Values.smtp.existingSecret) }}
  {{- if and .Values.smtp.password (not .Values.smtp.username) }}
  {{- fail "smtp.username is required when smtp.password is set" }}
  {{- end }}
  OUTBOX_ENCRYPTION_KEY: {{ required "smtp.outboxEncryptionKey is required when SMTP is enabled" .Values.smtp.outboxEncryptionKey | b64enc | quote }}
  {{- if .Values.smtp.username }}
  SMTP_USERNAME: {{ .Values.smtp.username | b64enc | quote }}
  SMTP_PASSWORD: {{ required "smtp.password is required when smtp.username is set" .Values.smtp.password | b64enc | quote }}
  {{- end }}
  {{- end }}
