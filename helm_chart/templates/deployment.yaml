{{- if and (eq .Values.database.backend "sqlite") (gt (int .Values.replicaCount) 1) }}
{{- fail "database.backend=sqlite requires replicaCount=1" }}
{{- end }}
{{- if and (eq .Values.database.backend "sqlite") .Values.autoscaling.enabled }}
{{- fail "database.backend=sqlite does not support autoscaling" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "linkkeys.fullname" . }}
  labels:
    {{- include "linkkeys.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- if eq .Values.database.backend "sqlite" }}
  # SQLite stores data on a ReadWriteOnce volume. A rolling update can't attach
  # it to the new pod while the old pod still holds it (Multi-Attach), so the
  # rollout deadlocks. Recreate terminates the old pod first, releasing the volume.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "linkkeys.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/ui-config: {{ include (print $.Template.BasePath "/ui-configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "linkkeys.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "linkkeys.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: https
              containerPort: {{ .Values.server.httpsPort }}
              protocol: TCP
            - name: tcp
              containerPort: {{ .Values.server.tcpPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "linkkeys.fullname" . }}
            - secretRef:
                name: {{ include "linkkeys.fullname" . }}
          env:
            {{- if and .Values.smtp.enabled .Values.smtp.existingSecret }}
            - name: OUTBOX_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.smtp.existingSecret }}
                  key: OUTBOX_ENCRYPTION_KEY
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.smtp.existingSecret }}
                  key: SMTP_USERNAME
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.smtp.existingSecret }}
                  key: SMTP_PASSWORD
                  optional: true
            {{- end }}
            {{- if .Values.postgresql.enabled }}
            # Construct DATABASE_URL from Zalando operator-created credentials
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.user | default "linkkeys" }}.{{ include "linkkeys.fullname" . }}-postgres.credentials.postgresql.acid.zalan.do
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.user | default "linkkeys" }}.{{ include "linkkeys.fullname" . }}-postgres.credentials.postgresql.acid.zalan.do
                  key: password
            - name: DATABASE_URL
              value: "postgresql://$(PGUSER):$(PGPASSWORD)@{{ include "linkkeys.fullname" . }}-postgres:5432/{{ .Values.postgresql.database | default "linkkeys" }}?sslmode=require"
            {{- end }}
          {{- if or (eq .Values.database.backend "sqlite") .Values.rp.claimsConfig .Values.ui.configuration .Values.ui.distExistingConfigMap .Values.ui.extraVolumeMounts }}
          volumeMounts:
            {{- if eq .Values.database.backend "sqlite" }}
            - name: data
              mountPath: /data
            {{- end }}
            {{- if .Values.rp.claimsConfig }}
            - name: rp-claims
              mountPath: /config
              readOnly: true
            {{- end }}
            {{- if .Values.ui.configuration }}
            - name: ui-config
              mountPath: /config/ui
              readOnly: true
            {{- end }}
            {{- if .Values.ui.distExistingConfigMap }}
            - name: ui-dist
              mountPath: /config/ui-dist
              readOnly: true
            {{- end }}
            {{- with .Values.ui.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          # Readiness gates Service traffic until the HTTP server starts.
          # Liveness is lenient during database startup work.
          readinessProbe:
            httpGet:
              path: /readiness
              port: https
              scheme: {{ if eq (toString .Values.server.disableTls) "true" }}HTTP{{ else }}HTTPS{{ end }}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: tcp
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or (eq .Values.database.backend "sqlite") .Values.rp.claimsConfig .Values.ui.configuration .Values.ui.distExistingConfigMap .Values.ui.extraVolumes }}
      volumes:
        {{- if eq .Values.database.backend "sqlite" }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "linkkeys.fullname" . }}-data
        {{- end }}
        {{- if .Values.rp.claimsConfig }}
        - name: rp-claims
          configMap:
            name: {{ include "linkkeys.fullname" . }}-rp-claims
        {{- end }}
        {{- if .Values.ui.configuration }}
        - name: ui-config
          configMap:
            name: {{ include "linkkeys.fullname" . }}-ui
        {{- end }}
        {{- if .Values.ui.distExistingConfigMap }}
        - name: ui-dist
          configMap:
            name: {{ .Values.ui.distExistingConfigMap | quote }}
        {{- end }}
        {{- with .Values.ui.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
