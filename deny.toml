[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # The bundled SQLite in libsqlite3-sys < 0.39 can return uninitialized
    # page-cache memory. We do not build the bundled SQLite: no crate enables
    # the `bundled` feature, so we link the system libsqlite3 (Debian package
    # in the image). diesel 2.3.14 requires libsqlite3-sys < 0.39, so we cannot
    # update. Remove this entry when a diesel 2.3.x release allows 0.39.
    { id = "RUSTSEC-2026-0459", reason = "system SQLite is linked, not the bundled copy; diesel 2.3.14 caps libsqlite3-sys < 0.39" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "0BSD",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
