[package]
name = "linkkeys"
version = "0.1.0"
edition = "2021"
default-run = "linkkeys"
license = "Apache-2.0"

[features]
default = ["postgres", "sqlite"]
postgres = ["diesel/postgres"]
sqlite = ["diesel/sqlite"]
smtp-native-tls = ["lettre/tokio1-native-tls"]

[dependencies]
liblinkkeys = { path = "../liblinkkeys" }
linkkeys-rpc-client = { path = "../linkkeys-rpc-client" }
# CSIL transport family. Vendored copy for now while the crate is iterated; the
# git dep is verified working (public repo) — SWAP at the end:
#   csilgen-transport = { git = "https://github.com/catalystcommunity/csilgen.git" }
csilgen-transport = { path = "../csilgen-transport" }

# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Web framework
# Rocket enables HTTP/2 by default. LinkKeys does not require HTTP/2, so keep
# it disabled and reduce the exposed protocol and dependency surface.
rocket = { version = "0.5", default-features = false, features = ["json", "tls", "secrets"] }

# Database
diesel = { version = "2.2", features = ["r2d2", "uuid", "chrono", "i-implement-a-third-party-backend-and-opt-into-breaking-changes"] }
diesel_migrations = "2.2"
r2d2 = "0.8"

# UUID support
uuid = { version = "1.10", features = ["v7", "serde"] }

# Serialization
ciborium = "0.2"
serde = { version = "1.0", features = ["derive"] }
# Persistence only — JSON-typed database columns. Never a wire format: the
# protocol is CBOR end to end (see docs/spec invariant I-5).
serde_json = "1.0"
toml = "0.8"

# TLS
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std"] }
rustls-pki-types = "1"
x509-parser = "0.16"

# Threading
threadpool = "1.8"
num_cpus = "1.16"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Cryptography (re-export for CLI key handling)
ed25519-dalek = { version = "2", features = ["rand_core"] }

# Password hashing
bcrypt = "0.17"

# HTTP client (fetch RP public keys for auth flow)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# DNS resolution
hickory-resolver = "0.26"
tokio = { version = "1", features = ["rt-multi-thread"] }

# Outbound email. Rustls is in the normal build. Native TLS is opt-in through
# the `smtp-native-tls` LinkKeys feature because it can add an OpenSSL system
# dependency on Linux.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "pool", "tokio1-rustls", "ring", "rustls-platform-verifier"] }

# Encoding
base64ct = { version = "1", features = ["alloc"] }

# QR code rendering (SVG) for the verification-request UI convenience.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# Utilities
env_logger = "0.11"
log = "0.4"
ipnet = "2"
rand = "0.8"
sha2 = "0.10"
urlencoding = "2"

[dev-dependencies]
