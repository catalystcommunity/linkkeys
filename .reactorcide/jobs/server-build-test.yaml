name: linkkeys-server-build-test
description: "Verify the linkkeys server Docker image builds successfully on PR"
# Triggering lives in .reactorcide/workflows/pr-server-image.yaml.
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "bash ${REACTORCIDE_CODE_DIR:-/job/src}/.reactorcide/jobs/scripts/server-build-test.sh"
  timeout: 1800
  capabilities:
    - builder
  run_as:
    user: runner
