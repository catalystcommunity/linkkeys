name: linkkeys-test-regular-rp-go
description: "Test the regular-RP Go SDK against the application-key conformance vectors"
# Triggering lives in .reactorcide/workflows/pr.yaml.
#
# The body is a script rather than an inline command block, matching the other
# non-trivial jobs here (server-build-test, server-build-and-deploy). An inline
# block is re-quoted on its way to the runner's shell, which is how the first
# version of this job died with "sh: Syntax error: Unterminated quoted string"
# AFTER the tests had already passed.
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "bash ${REACTORCIDE_CODE_DIR:-/job/src}/.reactorcide/jobs/scripts/test-regular-rp-go.sh"
  timeout: 900
  priority: 10
  run_as:
    user: runner
  run_local:
    as_runner: true
