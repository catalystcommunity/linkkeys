name: linkkeys-website-build-test
description: "Verify the website Docker image builds successfully on PR"
# Triggering lives in .reactorcide/workflows/pr-website.yaml.
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "bash ${REACTORCIDE_CODE_DIR:-/job/src}/.reactorcide/jobs/scripts/website-build-test.sh"
  timeout: 900
  capabilities:
    - builder
  run_as:
    user: runner
