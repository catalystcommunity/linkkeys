name: linkkeys-demoappsite-build-test
description: "Verify the demoappsite Docker image builds successfully on PR"
# Triggering lives in .reactorcide/workflows/pr-demoappsite.yaml.
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "bash ${REACTORCIDE_CODE_DIR:-/job/src}/.reactorcide/jobs/scripts/demoappsite-build-test.sh"
  timeout: 1800
  capabilities:
    - builder
  run_as:
    user: runner
