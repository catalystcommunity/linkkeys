name: linkkeys-test-sqlite
description: "Run tests against the SQLite backend"
# Triggering lives in .reactorcide/workflows/pr.yaml.
#
# The body is a runnerlib lifecycle job: REACTORCIDE_CI_JOB selects a function
# from CI_JOBS in .reactorcide/plugins/plugin_ci_jobs.py, which runs its
# commands through subprocess without a shell.
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  timeout: 3600
  priority: 10
  working_dir: /job
  run_as:
    user: runner
  resources:
    cpu:
      request: "4"
      limit: "8"
    memory:
      limit: "12Gi"
environment:
  REACTORCIDE_CI_JOB: test-sqlite
