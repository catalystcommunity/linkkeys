# Website image build + Helm deploy, fired by its own version bump.
id: linkkeys-deploy-website
name: LinkKeys website deploy
on:
  events:
    - push
  branches:
    - main
paths:
  include:
    - "website/content/extra_files/VERSION.txt"
jobs:
  linkkeys-website-build-and-deploy:
    job_file: .reactorcide/jobs/website-build-and-deploy.yaml
